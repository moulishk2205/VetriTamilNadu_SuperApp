<!doctype html><meta charset="utf-8"><title>wait</title>
<pre id="lg"></pre><pre id="sm"></pre>
<script>
// Chroma-key the portrait's yellow backdrop into an alpha matte and export WebP at two sizes.
const img = new Image();
img.onload = () => {
  const c = document.createElement('canvas'); c.width = 1280; c.height = 1600;
  const x = c.getContext('2d', { willReadFrequently: true });
  x.drawImage(img, 0, 0);
  const d = x.getImageData(0, 0, 1280, 1600), p = d.data;
  const ss = (a, b, v) => { const t = Math.max(0, Math.min(1, (v - a) / (b - a))); return t * t * (3 - 2 * t); };
  for (let i = 0; i < p.length; i += 4) {
    const r = p[i], g = p[i + 1], b = p[i + 2];
    const a = 1 - ss(108, 158, Math.min(r, g) - b);
    if (a < 1) { const k = 1 - a; p[i] = r * (1 - 0.35 * k); p[i + 1] = g * (1 - 0.45 * k); }
    p[i + 3] = Math.round(255 * a);
  }
  x.putImageData(d, 0, 0);
  document.getElementById('lg').textContent = c.toDataURL('image/webp', 0.88);
  const s = document.createElement('canvas'); s.width = 640; s.height = 800;
  const y = s.getContext('2d'); y.imageSmoothingQuality = 'high'; y.drawImage(c, 0, 0, 640, 800);
  document.getElementById('sm').textContent = s.toDataURL('image/webp', 0.86);
  document.title = 'done';
};
img.src = 'assets/cm-portrait.jpg';
</script>
