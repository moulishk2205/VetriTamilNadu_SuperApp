# Secrets come from the environment (or an untracked .env next to this file)
# and have no defaults: `docker compose up` refuses to start without them.
#   POSTGRES_PASSWORD   database password (URL-safe characters only)
#   REDIS_PASSWORD      redis password
#   JWT_ACCESS_SECRET   at least 32 random characters, e.g. `openssl rand -hex 32`
# Demo switches, both OFF unless set explicitly:
#   AUTH_MOCK=true      fixed OTP 123456 + Demo Mode personas
#   SEED_ON_BOOT=true   seed demo data when the database is empty
#
# The web portal (8080) is the public entry point. The API (4000) is published
# on the host's loopback only, for tools and tests on the host; browsers reach it
# through the portal's /api proxy. Postgres and Valkey are reachable only on the
# compose network. For local development from the host, add the loopback-only
# override: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
services:
  postgres:
    image: postgres:16-alpine
    container_name: vetri-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vetri
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: vetri
    volumes:
      - vetri-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vetri -d vetri']
      interval: 5s
      timeout: 5s
      retries: 10

  # Valkey (BSD-3-Clause), the Linux Foundation fork of Redis: same protocol,
  # no copyleft (Redis 7.4+ is RSALv2/SSPLv1; Redis 8 adds AGPLv3). The service keeps
  # the name `redis` so REDIS_HOST and client libraries work unchanged.
  redis:
    image: valkey/valkey:8.1-alpine
    container_name: vetri-redis
    restart: unless-stopped
    command: ['valkey-server', '--requirepass', '${REDIS_PASSWORD:?set REDIS_PASSWORD}']
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    healthcheck:
      # valkey-cli exits 0 even on an auth error, so require an actual PONG.
      test: ['CMD-SHELL', 'valkey-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: .
    container_name: vetri-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: '4000'
      API_PREFIX: api
      DATABASE_URL: postgresql://vetri:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/vetri?schema=public
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET}
      JWT_ACCESS_TTL: '900'
      JWT_REFRESH_TTL: '1209600'
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      GATEWAY_MODE: mock
      AUTH_MOCK: ${AUTH_MOCK:-false}
      SEED_ON_BOOT: ${SEED_ON_BOOT:-false}
      SWAGGER: ${SWAGGER:-false}
      SLA_SWEEP_MINUTES: ${SLA_SWEEP_MINUTES:-15}
      # One trusted hop (the portal's nginx, or the Vite dev proxy), so rate
      # limits and audit rows use each visitor's address. Safe because the API
      # port is published on loopback only: remote clients cannot reach it
      # directly with a forged X-Forwarded-For.
      TRUST_PROXY: ${TRUST_PROXY:-1}
    ports:
      - '127.0.0.1:4000:4000'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:4000/health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  # Web portal: the built SPA served by nginx as a non-root user on 8080, with
  # /api proxied to the backend so the browser talks to a single origin.
  # nginx forwards X-Forwarded-For, which the API trusts for one hop
  # (TRUST_PROXY above).
  web:
    build:
      context: ..
      dockerfile: Dockerfile.web
    container_name: vetri-web
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '8080:8080'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  vetri-pgdata:
