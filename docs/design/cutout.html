<!doctype html><meta charset="utf-8"><style>html,body{margin:0;background:transparent}canvas{display:block}</style>
<canvas id="c" width="1280" height="1600"></canvas>
<script>
// Chroma-key the portrait's yellow backdrop into a real alpha matte.
const img = new Image();
img.onload = () => {
  const c = document.getElementById('c'), x = c.getContext('2d');
  x.drawImage(img, 0, 0);
  const d = x.getImageData(0, 0, 1280, 1600), p = d.data;
  const ss = (a, b, v) => { const t = Math.max(0, Math.min(1, (v - a) / (b - a))); return t * t * (3 - 2 * t); };
  for (let i = 0; i < p.length; i += 4) {
    const r = p[i], g = p[i + 1], b = p[i + 2];
    const yellow = Math.min(r, g) - b;                 // backdrop ≈ 175-225, skin ≈ 40-95, hair/suit/shirt ≈ 0
    const a = 1 - ss(108, 158, yellow);
    if (a < 1) {                                       // pull yellow spill out of soft edges
      const k = 1 - a; p[i] = r * (1 - 0.35 * k); p[i + 1] = g * (1 - 0.45 * k);
    }
    p[i + 3] = Math.round(255 * a);
  }
  x.putImageData(d, 0, 0); document.title = 'done';
};
img.src = 'assets/cm-portrait.jpg';
</script>
